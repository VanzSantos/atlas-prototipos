<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa do fluxo · Acompanhar tarefas</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #1d1d1f; }
    header { padding: 16px 24px; border-bottom: 1px solid #d2d2d7; }
    header h1 { margin: 0; font-size: 18px; } header p { margin: 4px 0 0; color: #6e6e73; font-size: 13px; }
    svg { display: block; margin: 24px; max-width: calc(100% - 48px); height: auto; }
    .no rect { fill: #f5f5f7; stroke: #1d1d1f; stroke-width: 1.5; rx: 10; }
    .no.inicio rect { fill: #e6f0ff; stroke: #0a5cff; }
    .no.futuro rect { stroke-dasharray: 5 4; fill: #fff; }
    .no text { font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
    .seta { stroke: #6e6e73; stroke-width: 1.5; fill: none; marker-end: url(#ponta); }
    .rotulo { font-size: 12px; fill: #6e6e73; text-anchor: middle; }
  </style>
</head>
<body>
  <header>
    <h1>Mapa do fluxo · Acompanhar tarefas</h1>
    <p>Toda a navegação do fluxo. Tracejado = ainda não prototipado.</p>
  </header>
  <svg viewBox="0 0 640 200" role="img" aria-label="Menu interno leva ao Painel de tarefas, que leva ao Detalhe da tarefa (ainda não prototipado)">
    <defs><marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e6e73"/></marker></defs>
    <g class="no inicio"><rect x="10" y="70" width="140" height="56"/><text x="80" y="98">Menu interno</text></g>
    <g class="no"><rect x="240" y="70" width="160" height="56"/><text x="320" y="98">Painel de tarefas</text></g>
    <g class="no futuro"><rect x="480" y="70" width="150" height="56"/><text x="555" y="98">Detalhe da tarefa</text></g>
    <path class="seta" d="M150 98H238"/><text class="rotulo" x="194" y="88">Tarefas</text>
    <path class="seta" d="M400 98H478"/><text class="rotulo" x="439" y="88">Clica na linha</text>
  </svg>
</body>
</html>
