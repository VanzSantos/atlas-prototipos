<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendamento de consulta</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f7; color: #1d1d1f; }
    main { max-width: 420px; margin: 0 auto; padding: 24px 16px; }
    .tela { display: none; } .tela.ativa { display: block; }
    button, a.botao { display: block; width: 100%; padding: 14px; margin-top: 12px; border: 0;
      border-radius: 10px; background: #0a5cff; color: #fff; font-size: 16px; text-align: center;
      text-decoration: none; cursor: pointer; }
    .dia { background: #fff; color: #1d1d1f; border: 1px solid #d2d2d7; }
  </style>
</head>
<body>
  <main>
    <section class="tela" data-rota="#/data">
      <h1>Escolha uma data</h1>
      <p>Dados fictícios.</p>
      <a class="botao dia" href="#/confirmar">Segunda, 10h</a>
      <a class="botao dia" href="#/confirmar">Quarta, 14h</a>
      <a class="botao dia" href="#/confirmar">Sexta, 9h</a>
    </section>
    <section class="tela" data-rota="#/confirmar">
      <h1>Consulta marcada</h1>
      <p>Você receberá um lembrete um dia antes.</p>
      <a class="botao" href="#/data">Voltar</a>
    </section>
  </main>
  <script>
    function mostrar() {
      const rota = location.hash || "#/data";
      document.querySelectorAll(".tela").forEach((t) =>
        t.classList.toggle("ativa", t.dataset.rota === rota));
    }
    addEventListener("hashchange", mostrar);
    mostrar();
  </script>
</body>
</html>
